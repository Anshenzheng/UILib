<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拾光文创美学馆 - 极品青绿版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #f4f7f6; /* 清透的绢丝青白底色 */
            --bg-card: #ffffff; /* 纯净玉白卡片 */
            --primary-gold: #d4af37; /* 古法沙金（高级、内敛） */
            --light-gold: #f4e8c1; /* 淡金 */
            --teal-gradient: linear-gradient(135deg, rgba(46, 125, 50, 0.85), rgba(0, 96, 100, 0.9)); /* 核心青绿山水渐变 overlay */
            --text-main: #2c3e50; /* 沉稳的水墨青灰字 */
            --text-muted: #8a99a6; /* 烟雨灰次要字 */
            --price-red: #e63946; /* 胭脂红（提亮价格） */
            --accent-shadow: rgba(46, 125, 50, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Noto Serif SC', serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #cbd5e1; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 模拟手机容器 */
        .app-container {
            width: 100%;
            max-width: 412px;
            height: 844px;
            background-color: var(--bg-main);
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden; /* 裁剪直角子元素 */
            display: flex;
            flex-direction: column;
            border: 8px solid #1e293b;
            /* 关键修复：加入复合裁剪属性，彻底解决某些浏览器下 absolute 元素穿透圆角的问题 */
            transform: translateZ(0); 
            mask-image: radial-gradient(white, black);
            -webkit-mask-image: -webkit-radial-gradient(white, black);
        }

        /* 手机状态栏 */
        .status-bar {
            height: 40px;
            padding: 0 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #fff;
            font-weight: 600;
            z-index: 15;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }

        /* 滚动内容区域 */
        .scroll-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 110px; /* 留出空间防止底部导航遮挡商品 */
            scrollbar-width: none;
        }
        .scroll-content::-webkit-scrollbar {
            display: none;
        }

        /* 店铺头部 - 升级为千里江山真实质感图背景 */
        .shop-header {
            background: var(--teal-gradient), url('https://gw.alicdn.com/bao/uploaded/i3/2219000763722/O1CN01FUAG211dMjFsjdiiA_!!2219000763722.jpg') center/cover;
            padding: 60px 20px 45px 20px;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            color: #ffffff;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 96, 100, 0.15);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .header-top i {
            color: var(--light-gold);
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-box {
            position: relative;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid var(--light-gold);
            object-fit: cover;
            background: #fff;
        }

        .shop-tag {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #fff, var(--light-gold));
            color: #004d40;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .shop-name {
            font-family: 'Noto Serif SC', serif;
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 4px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .shop-bio {
            font-size: 11px;
            opacity: 0.9;
            color: #e0f2f1;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }

        /* 搜索框 */
        .search-box {
            position: absolute;
            bottom: -24px;
            left: 20px;
            right: 20px;
            background: #ffffff;
            border-radius: 18px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 96, 100, 0.08);
            gap: 10px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .search-box i {
            color: var(--primary-gold);
        }

        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 13px;
            color: var(--text-main);
            background: transparent;
        }

        /* 文创分类 */
        .categories {
            margin-top: 45px;
            padding: 0 20px;
        }

        .section-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 16px;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title h3 {
            position: relative;
            padding-left: 12px;
        }

        .section-title h3::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 14px;
            background: var(--primary-gold);
            border-radius: 2px;
        }

        .section-title span {
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            color: var(--text-muted);
        }

        .category-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: none;
        }
        .category-list::-webkit-scrollbar { display: none; }

        .cat-item {
            padding: 8px 16px;
            background-color: #ffffff;
            border: 1px solid rgba(0,0,0,0.04);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-main);
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: all 0.3s;
        }

        .cat-item.active {
            background: #006064;
            color: #ffffff;
            border-color: #006064;
            box-shadow: 0 4px 12px rgba(0, 96, 100, 0.2);
        }

        /* 商品列表 瀑布流 */
        .products-section {
            margin-top: 25px;
            padding: 0 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .product-card {
            background-color: var(--bg-card);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 15px var(--accent-shadow);
            border: 1px solid rgba(0,0,0,0.03);
            position: relative;
            transition: transform 0.3s ease;
        }
        
        .product-card:active {
            transform: scale(0.98);
        }

        .product-img-wrapper {
            position: relative;
            height: 160px;
            overflow: hidden;
            background-color: #f5f5f5;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .cultural-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.92);
            color: #006064;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            backdrop-filter: blur(4px);
            z-index: 2;
        }

        .fav-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.92);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--price-red);
            font-size: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            z-index: 2;
        }

        .product-info {
            padding: 12px;
        }

        .product-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            color: var(--text-main);
            font-weight: 600;
            line-height: 1.4;
            height: 36px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            color: var(--price-red);
            font-weight: 700;
            font-size: 16px;
        }

        .product-price::before {
            content: "￥";
            font-size: 11px;
        }

        .add-cart-btn {
            background-color: #f0f7f6;
            color: #006064;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .add-cart-btn:hover {
            background-color: #006064;
            color: white;
        }

        /* 底部浮动购物车 */
        .cart-badge {
            position: absolute;
            right: 20px;
            bottom: 95px;
            background: #1e293b;
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(30, 41, 59, 0.2);
            font-size: 12px;
            font-weight: 600;
            z-index: 99;
        }
        
        .cart-badge i {
            color: var(--primary-gold);
        }

        /* 底部导航 - 关键修复区域 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(0,0,0,0.03);
            padding-bottom: 8px; /* 微微增加底部留白，更符合全面屏手势习惯 */
            z-index: 10;
            
            /* 关键修复：确保导航栏自身底部也是圆角，完美贴合外壳 */
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 11px;
            gap: 4px;
            transition: all 0.3s;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: #006064;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="status-bar">
            <span>09:41</span>
            <div style="display: flex; gap: 5px; align-items: center;">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-three-quarters"></i>
            </div>
        </div>

        <div class="scroll-content">
            
            <div class="shop-header">
                <div class="header-top">
                    <i class="fas fa-chevron-left"></i>
                    <i class="fas fa-share-alt"></i>
                </div>
                <div class="profile-section">
                    <div class="avatar-box">
                        <img class="avatar" src="https://gw.alicdn.com/bao/uploaded/i2/3255668163/O1CN01R43weE2AAi7xjo8Gk_!!3255668163.jpg" alt="头像">
                        <span class="shop-tag">官方认证</span>
                    </div>
                    <div>
                        <div class="shop-name">拾光文创美学馆</div>
                        <div class="shop-bio">「一眼千年，把东方浪漫带回家」</div>
                    </div>
                </div>
                
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="搜寻诗意周边、纸墨字画...">
                </div>
            </div>

            <div class="categories">
                <div class="section-title">
                    <h3>游园寻宝</h3>
                    <span>全卷展开</span>
                </div>
                <div class="category-list">
                    <div class="cat-item active">甄选雅物</div>
                    <div class="cat-item">故宫印记</div>
                    <div class="cat-item">非遗手作</div>
                    <div class="cat-item">诗词纸墨</div>
                    <div class="cat-item">现代国潮</div>
                </div>
            </div>

            <div class="products-section">
                <div class="section-title">
                    <h3>岁时新赏</h3>
                </div>
                
                <div class="products-grid">
                    <div class="product-card">
                        <div class="product-img-wrapper">
                            <span class="cultural-badge">故宫联名</span>
                            <div class="fav-btn"><i class="fas fa-heart"></i></div>
                            <img class="product-img" src="https://gw.alicdn.com/bao/uploaded/i3/2219000763722/O1CN01FUAG211dMjFsjdiiA_!!2219000763722.jpg" alt="千里江山图书签">
                        </div>
                        <div class="product-info">
                            <div class="product-title">千里江山图 纯丝绸复古书签礼盒</div>
                            <div class="product-bottom">
                                <span class="product-price">68</span>
                                <div class="add-cart-btn"><i class="fas fa-plus"></i></div>
                            </div>
                        </div>
                    </div>

                    <div class="product-card">
                        <div class="product-img-wrapper">
                            <span class="cultural-badge">非遗手作</span>
                            <div class="fav-btn"><i class="far fa-heart"></i></div>
                            <img class="product-img" src="https://gw.alicdn.com/bao/uploaded/i4/3539971742/O1CN01RrO0M01OjssRDnMTi_!!3539971742.jpg" alt="祥云耳坠">
                        </div>
                        <div class="product-info">
                            <div class="product-title">手工掐丝珐琅彩 祥云复古纯银耳坠</div>
                            <div class="product-bottom">
                                <span class="product-price">245</span>
                                <div class="add-cart-btn"><i class="fas fa-plus"></i></div>
                            </div>
                        </div>
                    </div>

                    <div class="product-card">
                        <div class="product-img-wrapper">
                            <span class="cultural-badge">独家限定</span>
                            <div class="fav-btn"><i class="far fa-heart"></i></div>
                            <img class="product-img" src="https://gw.alicdn.com/bao/uploaded/i2/3255668163/O1CN01R43weE2AAi7xjo8Gk_!!3255668163.jpg" alt="九色鹿线香">
                        </div>
                        <div class="product-info">
                            <div class="product-title">九色鹿神话 主题沉香线香（含青瓷香托）</div>
                            <div class="product-bottom">
                                <span class="product-price">119</span>
                                <div class="add-cart-btn"><i class="fas fa-plus"></i></div>
                            </div>
                        </div>
                    </div>

                    <div class="product-card">
                        <div class="product-img-wrapper">
                            <span class="cultural-badge">诗词纸墨</span>
                            <div class="fav-btn"><i class="fas fa-heart"></i></div>
                            <img class="product-img" src="https://gw.alicdn.com/imgextra/i3/2668281278/O1CN01lI85nb1LJN9hL7Gyq_!!2668281278.jpg" alt="唐诗宋词手账本">
                        </div>
                        <div class="product-info">
                            <div class="product-title">唐诗宋词宣纸活页手账本（附赠定制毛笔）</div>
                            <div class="product-bottom">
                                <span class="product-price">89</span>
                                <div class="add-cart-btn"><i class="fas fa-plus"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="cart-badge">
            <i class="fas fa-shopping-bag"></i>
            <span>3 件雅物已入囊中</span>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active">
                <i class="fas fa-feather-alt"></i>
                <span>小店</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-compass"></i>
                <span>发现</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-comment-alt"></i>
                <span>知音</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-user-alt"></i>
                <span>我的</span>
            </div>
        </div>

    </div>

    <script>
        // 分类点击
        const catItems = document.querySelectorAll('.cat-item');
        catItems.forEach(item => {
            item.addEventListener('click', () => {
                catItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });

        // 收藏爱心
        const favBtns = document.querySelectorAll('.fav-btn i');
        favBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if(btn.classList.contains('far')) {
                    btn.className = 'fas fa-heart';
                } else {
                    btn.className = 'far fa-heart';
                }
            });
        });
    </script>
</body>
</html>

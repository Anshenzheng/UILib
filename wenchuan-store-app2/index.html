<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拾光文创美学馆 - 独立发现杂志页</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Serif+SC:wght@200;400;700&family=Outfit:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #f9fbfb;       /* 极轻盈的瓷青白，带有艺术纸张感 */
            --ink-dense: #0f161c;     /* 浓墨黑 */
            --gold-leaf: #b09160;     /* 贴金箔色 */
            --text-muted: #828f96;    /* 远山灰 */
            --ceramic-white: #ffffff;
            --nav-bg: rgba(255, 255, 255, 0.9);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', 'Noto Serif SC', serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e2e8f0; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 手机容器 */
        .app-container {
            width: 100%;
            max-width: 412px;
            height: 844px;
            background-color: var(--bg-main);
            border-radius: 40px;
            box-shadow: 0 40px 90px rgba(15, 22, 28, 0.08);
            position: relative;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            border: 8px solid #0f161c;
            transform: translateZ(0);
            mask-image: radial-gradient(white, black);
            -webkit-mask-image: -webkit-radial-gradient(white, black);
        }

        /* 状态栏 */
        .status-bar {
            height: 44px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--ink-dense);
            font-weight: 600;
            z-index: 30;
        }

        .scroll-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 90px; 
            scrollbar-width: none;
        }
        .scroll-content::-webkit-scrollbar { display: none; }

        /* --- 杂志风独立导航区 --- */
        .magazine-header {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .magazine-logo {
            display: flex;
            flex-direction: column;
        }

        .magazine-logo .en {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            letter-spacing: 3px;
            color: var(--ink-dense);
            line-height: 1;
        }

        .magazine-logo .zh {
            font-family: 'Noto Serif SC', serif;
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
        }

        .magazine-nav-dots {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 4px;
        }

        .nav-dot-btn {
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 400;
        }

        .nav-dot-btn.active {
            color: var(--ink-dense);
            font-weight: 700;
        }

        /* --- 模块一：数字线上策展（大视觉） --- */
        .curation-section {
            padding: 16px 24px;
        }

        .curation-banner {
            width: 100%;
            height: 240px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(15, 22, 28, 0.05);
        }

        .curation-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85);
            transition: var(--transition);
        }

        .curation-banner:hover img {
            transform: scale(1.02);
        }

        .curation-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 40%, rgba(15, 22, 28, 0.7));
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .curation-badge {
            align-self: flex-start;
            background-color: var(--gold-leaf);
            color: white;
            font-size: 9px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .curation-title {
            font-family: 'Noto Serif SC', serif;
            color: white;
            font-size: 18px;
            font-weight: 300;
            line-height: 1.4;
            letter-spacing: 1px;
        }

        /* --- 模块二：大匠记忆·非遗叙事栏目（人文故事风） --- */
        .story-section {
            padding: 30px 24px 10px 24px;
        }

        .section-label {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            color: var(--gold-leaf);
            letter-spacing: 2px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: rgba(176, 145, 96, 0.2);
        }

        .story-card-layout {
            display: flex;
            background-color: var(--ceramic-white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.01);
            border: 1px solid rgba(0,0,0,0.02);
        }

        .story-img {
            width: 40%;
            height: 150px;
            background-color: #e2e8f0;
        }
        .story-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 故意做成稍微复古的人文黑白单色调感，拉开艺术差距 */
            filter: grayscale(0.2); 
        }

        .story-content {
            width: 60%;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .story-tag {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .story-heading {
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--ink-dense);
            line-height: 1.4;
            margin-top: 4px;
        }

        .story-desc {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 6px;
        }

        .story-author {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 11px;
            color: var(--ink-dense);
        }
        .story-author span { font-weight: 600; }
        .story-author i { color: var(--text-muted); transition: var(--transition); }
        .story-author i:hover { color: var(--gold-leaf); }

        /* --- 模块三：雅集视界·美学周刊（不对称先锋排版） --- */
        .gallery-section {
            padding: 24px 24px 10px 24px;
        }

        .gallery-grid-mix {
            display: grid;
            grid-template-columns: 1.20fr 0.8fr;
            gap: 14px;
            margin-top: 14px;
        }

        .gallery-left-block {
            background-color: var(--ceramic-white);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.01);
        }

        .gallery-left-block .img-hold {
            width: 100%;
            height: 130px;
        }
        .gallery-left-block .img-hold img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-txt-pad {
            padding: 12px;
        }
        .gallery-txt-pad h4 {
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            color: var(--ink-dense);
            font-weight: 600;
            line-height: 1.4;
        }

        .gallery-right-double {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .right-mini-card {
            flex: 1;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            height: 90px;
        }
        .right-mini-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .mini-card-mask {
            position: absolute;
            inset: 0;
            background: rgba(15, 22, 28, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Noto Serif SC', serif;
            font-size: 12px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        /* --- 极简全面屏底部导航 --- */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 76px;
            background-color: var(--nav-bg);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 12px;
            z-index: 20;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            border-top: 1px solid rgba(0, 0, 0, 0.03);
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 11px;
            gap: 4px;
            transition: var(--transition);
            opacity: 0.6;
        }

        .nav-link i { font-size: 18px; color: var(--text-muted); }

        .nav-link.active {
            color: var(--ink-dense);
            font-weight: 600;
            opacity: 1;
        }
        .nav-link.active i {
            color: var(--ink-dense);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="status-bar">
            <span>09:41</span>
            <div style="display: flex; gap: 6px; align-items: center; opacity: 0.8;">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-three-quarters"></i>
            </div>
        </div>

        <div class="scroll-content">
            
            <div class="magazine-header">
                <div class="magazine-logo">
                    <span class="en">Aesthetic</span>
                    <span class="zh">风物·发现</span>
                </div>
                <div class="magazine-nav-dots">
                    <span class="nav-dot-btn active">拾光策展</span>
                    <span class="nav-dot-btn">大匠栏目</span>
                </div>
            </div>

            <div class="curation-section">
                <div class="curation-banner">
                    <img src="https://gw.alicdn.com/bao/uploaded/i3/2219000763722/O1CN01FUAG211dMjFsjdiiA_!!2219000763722.jpg" alt="策展背景">
                    <div class="curation-overlay">
                        <span class="curation-badge">Vol.12 线上特展</span>
                        <div class="curation-title">青绿之间：千里江山图中的矿物美学与现代重构</div>
                    </div>
                </div>
            </div>

            <div class="story-section">
                <div class="section-label">THE CRAFTSMAN / 大匠记忆</div>
                <div class="story-card-layout">
                    <div class="story-img">
                        <img src="https://gw.alicdn.com/bao/uploaded/i4/3539971742/O1CN01RrO0M01OjssRDnMTi_!!3539971742.jpg" alt="非遗">
                    </div>
                    <div class="story-content">
                        <div>
                            <span class="story-tag">非遗手作 · 掐丝珐琅</span>
                            <div class="story-heading">一根金丝的温度：对话非遗传人张居明</div>
                            <div class="story-desc">在0.02毫米的铜丝间，听见传承与时光对抗的沙沙声。</div>
                        </div>
                        <div class="story-author">
                            <span>专访栏目组</span>
                            <i class="fas fa-arrow-right"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="gallery-section">
                <div class="section-label">VISUAL JOURNAL / 雅集美学周刊</div>
                
                <div class="gallery-grid-mix">
                    <div class="gallery-left-block">
                        <div class="img-hold">
                            <img src="https://gw.alicdn.com/imgextra/i3/2668281278/O1CN01lI85nb1LJN9hL7Gyq_!!2668281278.jpg" alt="视觉">
                        </div>
                        <div class="gallery-txt-pad">
                            <h4>文房新事：当现代宣纸活页本遇上小满节气的微雨。</h4>
                        </div>
                    </div>
                    
                    <div class="gallery-right-double">
                        <div class="right-mini-card">
                            <img src="https://gw.alicdn.com/bao/uploaded/i2/3255668163/O1CN01R43weE2AAi7xjo8Gk_!!3255668163.jpg" alt="mini">
                            <div class="mini-card-mask">瑞兽香道</div>
                        </div>
                        <div class="right-mini-card">
                            <img src="https://gw.alicdn.com/bao/uploaded/i3/2219000763722/O1CN01FUAG211dMjFsjdiiA_!!2219000763722.jpg" alt="mini">
                            <div class="mini-card-mask">+ 展开图集</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="bottom-nav">
            <div class="nav-link">
                <i class="linear-icon fas fa-store"></i>
                <span>小店</span>
            </div>
            <div class="nav-link active">
                <i class="linear-icon fas fa-compass"></i>
                <span>发现</span>
            </div>
            <div class="nav-link">
                <i class="linear-icon fas fa-comment-dots"></i>
                <span>知音</span>
            </div>
            <div class="nav-link">
                <i class="linear-icon fas fa-user"></i>
                <span>我的</span>
            </div>
        </div>

    </div>

    <script>
        // 顶层小导航切换
        const dots = document.querySelectorAll('.nav-dot-btn');
        dots.forEach(dot => {
            dot.addEventListener('click', () => {
                dots.forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
            });
        });
    </script>
</body>
</html>
